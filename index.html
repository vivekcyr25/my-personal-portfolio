<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivek - Personal Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Vivek</div>
            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="hero">
            <img src="https://raw.githubusercontent.com/vivekcyr25/Personal-website/main/frontend/profile-photo.png" alt="Vivek's Profile Photo" class="profile-photo">
            <h1>Hi, I'm Vivek</h1>
            <p>Computer Science Student & Developer</p>
        </section>
        <section id="contact">
            <h2>Contact Me</h2>
            <form id="contact-form" name="contact" method="POST" onsubmit="handleContactSubmit(event)">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="Your Message" required></textarea>
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    <div id="chatbot-container">
        <div class="chatbot-header">
            <div class="chatbot-title">
                <span class="chatbot-title-icon"><i class="fas fa-robot"></i></span>
                <span class="chatbot-title-text" id="chatbot-title-text">Chat with Vivek's Assistant</span>
            </div>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="chat-input" placeholder="Ask me something...">
            <button id="chat-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
